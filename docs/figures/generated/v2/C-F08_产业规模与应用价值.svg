<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="12" flood-color="#17324D" flood-opacity="0.09"/></filter><linearGradient id="sea" x1="0" x2="1"><stop stop-color="#17324D"/><stop offset="1" stop-color="#2B9BB0"/></linearGradient><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#9AA9B7" stroke-width="2"/></pattern></defs>
<rect width="1600" height="900" fill="#F7F9FB"/><rect x="0" y="0" width="1600" height="8" fill="url(#sea)"/>
<text x="80" y="72" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="38" font-weight="800" fill="#17232E" text-anchor="start">卫星产业规模持续增长，但本项目只主张调度方案的可迁移价值</text><text x="80" y="108" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="400" fill="#617181" text-anchor="start">比例环＋数量级点图；数据均为 SIA FY2025 口径</text>
<rect x="80" y="160" width="520" height="610" rx="22" fill="#FFFFFF" stroke="#DDE3E8" stroke-width="1.5" /><text x="120" y="215" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="23" font-weight="800" fill="#17232E" text-anchor="start">商业卫星产业占全球航天经济</text><circle cx="340" cy="420" r="140" fill="none" stroke="#E8EFF4" stroke-width="38"/><circle cx="340" cy="420" r="140" fill="none" stroke="#2B9BB0" stroke-width="38" stroke-dasharray="625 880" transform="rotate(-90 340 420)"/><text x="340" y="415" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="56" font-weight="900" fill="#2B9BB0" text-anchor="middle">71%</text><text x="340" y="455" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="700" fill="#617181" text-anchor="middle">商业卫星产业</text><text x="340" y="650" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="24" font-weight="900" fill="#17324D" text-anchor="middle">3030 / 4290 亿美元</text>
<rect x="650" y="160" width="870" height="610" rx="22" fill="#FFFFFF" stroke="#DDE3E8" stroke-width="1.5" /><text x="700" y="215" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="23" font-weight="800" fill="#17232E" text-anchor="start">FY2025 行业规模快照</text>
<text x="710" y="275" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="700" fill="#617181" text-anchor="start">数量级对照（横轴为 log10〔数量〕）</text><line x1="930" y1="570" x2="1430" y2="570" stroke="#17232E" stroke-width="2" />
<line x1="960" y1="300" x2="960" y2="570" stroke="#DDE3E8" stroke-width="1" stroke-dasharray="5 6"/><text x="960" y="605" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#617181" text-anchor="middle">10^2</text><line x1="1155" y1="300" x2="1155" y2="570" stroke="#DDE3E8" stroke-width="1" stroke-dasharray="5 6"/><text x="1155" y="605" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#617181" text-anchor="middle">10^3</text><line x1="1350" y1="300" x2="1350" y2="570" stroke="#DDE3E8" stroke-width="1" stroke-dasharray="5 6"/><text x="1350" y="605" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#617181" text-anchor="middle">10^4</text>
<text x="710" y="347" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="700" fill="#17232E" text-anchor="start">年末在轨卫星</text><line x1="930" y1="340" x2="1380.03" y2="340" stroke="#17324D" stroke-width="5" /><circle cx="1380.03" cy="340" r="13" fill="#17324D" stroke="none" stroke-width="0"/><text x="1400.03" y="347" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="21" font-weight="900" fill="#17324D" text-anchor="start">14266</text><text x="710" y="452" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="700" fill="#17232E" text-anchor="start">年度入轨卫星</text><line x1="930" y1="445" x2="1281.165" y2="445" stroke="#2B9BB0" stroke-width="5" /><circle cx="1281.165" cy="445" r="13" fill="#2B9BB0" stroke="none" stroke-width="0"/><text x="1301.165" y="452" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="21" font-weight="900" fill="#2B9BB0" text-anchor="start">4434</text><text x="710" y="557" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="700" fill="#17232E" text-anchor="start">年度发射次数</text><line x1="930" y1="550" x2="1051.845" y2="550" stroke="#D49A3A" stroke-width="5" /><circle cx="1051.845" cy="550" r="13" fill="#D49A3A" stroke="none" stroke-width="0"/><text x="1071.845" y="557" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="21" font-weight="900" fill="#D49A3A" text-anchor="start">296</text>
<text x="1180" y="620" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#617181" text-anchor="middle">对数轴只用于同时呈现跨数量级指标；标注值保留原始计数</text>
<rect x="700" y="660" width="720" height="60" rx="12" fill="#FFF5E3" stroke="#D49A3A" stroke-width="1.5" /><text x="1060" y="696" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="800" fill="#D49A3A" text-anchor="middle">行业数据说明需求规模，不等同项目性能或市场份额</text>

<line x1="80" y1="848" x2="1520" y2="848" stroke="#DDE3E8" stroke-width="1" /><text x="80" y="878" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="400" fill="#617181" text-anchor="start">来源：claim-P2；SIA 2026报告，统计年度FY2025。</text>
