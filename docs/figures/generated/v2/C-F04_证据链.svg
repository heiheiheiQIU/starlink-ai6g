<rect x="180" y="535" width="1240" height="90" rx="16" fill="#EDF7F4" stroke="#29977D" stroke-width="1.5" /><text x="800" y="575" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="23" font-weight="900" fill="#29977D" text-anchor="middle">单向事实流：事实源 → 统计 → claim → 门禁 → 材料</text><text x="800" y="607" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="700" fill="#617181" text-anchor="middle">任何数字变化必须从事实源重新生成；材料不得反向覆盖事实源</text>
<rect x="370" y="680" width="860" height="70" rx="14" fill="#FCEAEA" stroke="#D95C5C" stroke-width="1.5" /><text x="800" y="712" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="900" fill="#D95C5C" text-anchor="middle">拒绝：手抄数字、无来源截图、未签核结果、绝对路径与身份信息</text>

<line x1="80" y1="848" x2="1520" y2="848" stroke="#DDE3E8" stroke-width="1" /><text x="80" y="878" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="400" fill="#617181" text-anchor="start">项目证据：已签核事实源；图形为机制/开发期结果，不代表在轨性能</text>
