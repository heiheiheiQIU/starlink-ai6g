weight="600" fill="#617181" text-anchor="middle">样本数 + 缺失数</text><rect x="785" y="245" width="210" height="230" rx="20" fill="#FFFFFF" stroke="#2B9BB0" stroke-width="3" /><text x="890" y="295" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="900" fill="#2B9BB0" text-anchor="middle">④主张登记</text><text x="890" y="345" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="600" fill="#617181" text-anchor="middle">claim_id + scope</text><text x="890" y="368.25" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="600" fill="#617181" text-anchor="middle">status + source</text><rect x="1045" y="245" width="210" height="230" rx="20" fill="#FFFFFF" stroke="#D95C5C" stroke-width="3" /><text x="1150" y="295" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="900" fill="#D95C5C" text-anchor="middle">⑤发布门禁</text><text x="1150" y="345" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="600" fill="#617181" text-anchor="middle">数字一致性</text><text x="1150" y="368.25" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="600" fill="#617181" text-anchor="middle">匿名/占位/路径检查</text><rect x="1305" y="245" width="210" height="230" rx="20" fill="#FFFFFF" stroke="#17324D" stroke-width="3" /><text x="1410" y="295" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="900" fill="#17324D" text-anchor="middle">⑥材料消费</text><text x="1410" y="345" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="600" fill="#617181" text-anchor="middle">报告 · PPT</text><text x="1410" y="368.25" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="600" fill="#617181" text-anchor="middle">前端 · 视频</text>
