<text x="80" y="72" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="38" font-weight="800" fill="#17232E" text-anchor="start">每个结论都能沿 claim 回到运行、事件和版本指纹</text><text x="80" y="108" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="400" fill="#617181" text-anchor="start">证据追溯网络：材料不是代码截图的堆叠</text>
