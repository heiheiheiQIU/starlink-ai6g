<rect width="1600" height="900" fill="#F7F9FB"/><rect x="0" y="0" width="1600" height="8" fill="url(#sea)"/>
<text x="80" y="72" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="38" font-weight="800" fill="#17232E" text-anchor="start">确认丢失不会重复计收益：系统重传同一数据块并在接收端去重</text><text x="80" y="108" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="400" fill="#617181" text-anchor="start">协议泳道时序图</text>
