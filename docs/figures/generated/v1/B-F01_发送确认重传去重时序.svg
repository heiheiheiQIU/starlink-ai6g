<line x1="80" y1="848" x2="1520" y2="848" stroke="#DDE3E8" stroke-width="1" /><text x="80" y="878" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="400" fill="#617181" text-anchor="start">机制图；事件名称以冻结协议实现与验收记录为准。</text>
