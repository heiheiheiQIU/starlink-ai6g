265" font-family="Arial, 'Source Han Sans SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="800" fill="#2B88A3" text-anchor="middle" >score = 10.0</text><path d="M285 240 L410 240" fill="none" stroke="#2B88A3" stroke-width="3" marker-end="url(#a2B88A3)"/><rect x="410" y="175" width="205" height="130" fill="#FCF3E4" stroke="#D58A27" stroke-width="2" rx="2"/><text x="512" y="215" font-family="Arial, 'Source Han Sans SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="800" fill="#D58A27" text-anchor="middle" >ENERGY_RESERVE</text><text x="512" y="250" font-family="Arial, 'Source Han Sans SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="800" fill="#C84F55" text-anchor="middle" >0.49 &lt; 0.50 Wh</text><text x="512" y="280" font-family="Arial, 'Source Han Sans SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#C84F55" text-anchor="middle" >约束失败</text><path d="M615 240 L720 240" fill="none" stroke="#D58A27" stroke-width="3" marker-end="url(#aD58A27)"/><rect x="720" y="195" width="80" height="90" fill="#E9F5F1" stroke="#268B79" stroke-width="2" rx="2"/><text x="760" y="230" font-family="Arial, 'Source Han Sans SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="800" fill="#268B79" text-anchor="middle" >idle</text><text x="760" y="262" font-family="Arial, 'Source Han Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#526575" text-anchor="middle" >安全动作</text><rect x="105" y="365" width="695" height="82" fill="#F5F8FA" stroke="#D7E0E6" stroke-width="1.1" rx="2"/><text x="125" y="397" font-family="Arial, 'Source Han Sans SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="800" fill="#24506F" text-anchor="start" >结论</text><text x="185" y="397" font-family="Arial, 'Source Han Sans SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#172A3A" text-anchor="start" >AI高分不覆盖确定性安全边界；拒绝原因进入事件证据。</text><text x="185" y="425" font-family="Arial, 'Source Han Sans SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#C84F55" text-anchor="start" >该案例证明约束层有效，不证明学习模型性能。</text><rect x="865" y="45" width="780" height="470" fill="#FFFFFF" stroke="#D7E0E6" stroke-width="1.1" rx="2"/><text x="889" y="85" font-family="Arial, 'Source Han Sans SC', 'Microsoft YaHei', sans-serif" font-size="23" font-weight="800" fill="#172A3A" text-anchor="start" >(b)</text><text x="937" y="85" font-family="Arial, 'Source Han Sans SC', 'Microsoft YaHei', sans-serif" font-size="23" font-weight="800" fill="#172A3A" text-anchor="start" >模型包错误被转换为受控边界</text><text x="937" y="113" font-family="Arial, 'Source Han Sans SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="400" fill="#526575" text-anchor="start" >BadZipFile / EOFError → MODEL_FORMAT；禁止异常泄漏</text><rect x="900" y="205" width="140" height="105" fill="#F5F8FA" stroke="#D7E0E6" stroke-width="1.1" rx="2"/><text x="970" y="244" font-family="Arial, 'Source Han Sans SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="800" fill="#24506F" text-anchor="middle" >模型文件</text><text x="970" y="278" font-family="Arial, 'Source Han Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#526575" text-anchor="middle" >加载</text><path d="M1040 258 L1068 258" fill="none" stroke="#24506F" stroke-width="2" marker-end="url(#a24506F)"/><rect x="1075" y="205" width="140" height="105" fill="#F5F8FA" stroke="#D7E0E6" stroke-width="1.1" rx="2"/><text x="1145" y="244" font-family="Arial, 'Source Han Sans SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="800" fill="#24506F" text-anchor="middle" >格式校验</text><text x="1145" y="278" font-family="Arial, 'Source Han Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#526575" text-anchor="middle" >捕获异常</text><path d="M1215 258 L1243 258" fill="none" stroke="#C84F55" stroke-width="2" marker-end="url(#aC84F55)"/><rect x="1250" y="205" width="140" height="105" fill=